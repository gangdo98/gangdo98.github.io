</button>

<script>
(function () {
  'use strict';
  var STORE = 'tosil.portal.lock.v1';
  var PIN = '0716';
  var html = document.documentElement;
  var lock = document.getElementById('lock');
  var dots = document.getElementById('lockDots');
  var msg = document.getElementById('lockMsg');
  var relock = document.getElementById('relockBtn');
  var buf = '';

  function paint() {
    var ns = dots.querySelectorAll('i');
    for (var i = 0; i < ns.length; i++) ns[i].className = i < buf.length ? 'on' : '';
  }
  function open() {
    html.classList.add('unlocked');
    relock.hidden = false;
    buf = '';
    paint();
    msg.textContent = '';
  }
  function fail() {
    lock.classList.add('is-error');
    msg.textContent = '비밀번호가 맞지 않아요. 다시 눌러 주세요.';
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    setTimeout(function () {
      lock.classList.remove('is-error');
      buf = '';
      paint();
    }, 420);
  }
  function press(k) {
    if (k === 'reset') buf = '';
    else if (k === 'del') buf = buf.slice(0, -1);
    else if (/^[0-9]$/.test(k) && buf.length < 4) buf += k;
    msg.textContent = '';
    paint();
    if (buf.length === 4) {
      setTimeout(function () {
        if (buf !== PIN) return fail();
        try { localStorage.setItem(STORE, '1'); } catch (e) {}
        open();
      }, 90);
    }
  }

  document.getElementById('keypad').addEventListener('click', function (e) {
    var b = e.target.closest('[data-key]');
    if (b) press(b.dataset.key);
  });
  document.addEventListener('keydown', function (e) {
    if (html.classList.contains('unlocked')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Escape') press('reset');
  });
  relock.addEventListener('click', function () {
    try { localStorage.removeItem(STORE); } catch (e) {}
    html.classList.remove('unlocked');
    relock.hidden = true;
    buf = '';
    paint();
    msg.textContent = '';
  });

  if (html.classList.contains('unlocked')) relock.hidden = false;
})();
</script>
