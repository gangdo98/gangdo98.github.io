<body>

  <!-- ───────── 히어로 ───────── -->

      <p class="hero__today" id="todayLabel">2026년 11월 28일 토요일</p>

      <div class="hero__stats">
        <div class="stat">
          <span class="stat__label">기록</span>
          <span class="stat__value"><span id="statDone">0</span><span class="stat__unit">건</span></span>
          <span class="stat__meta">남겨 둔 일</span>
        </div>
        <div class="stat">
          <span class="stat__label">예정</span>
          <span class="stat__value"><span id="statPlanned">0</span><span class="stat__unit">건</span></span>
          <span class="stat__meta">앞으로의 일</span>
        </div>
        <div class="stat stat--next">
          <span class="stat__label">다음 일정</span>
          <span class="stat__value stat__value--sm" id="statNext">—</span>
          <span class="stat__meta" id="statNextMeta">불러오는 중</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ───────── 보기 전환 · 필터 ───────── -->

      <div class="chips chips--status" id="statusChips" role="group" aria-label="상태 필터"></div>
    </div>
  </div>

  <main>
    <!-- ───────── 1. 분기 달력 ───────── -->
    <section class="panel is-active" id="panel-quarter" aria-label="분기 달력 보기">
      <div class="qtrs" id="qtrTabs" role="tablist" aria-label="분기 선택"></div>
      <div class="calendars" id="calendars" aria-live="polite"></div>

      <div class="section">
        <div class="section__head">
          <h2 class="section__title" id="quarterListTitle">이 분기의 기록</h2>
          <span class="section__count" id="quarterListCount"></span>
        </div>
        <div id="quarterList"></div>
      </div>
    </section>

    <!-- ───────── 2. 월별 리스트 ───────── -->
    <section class="panel" id="panel-month" aria-label="월별 리스트 보기" hidden>
      <div class="section section--first">
        <div class="section__head">
          <h2 class="section__title">월별 기록 · 26.10 — 27.12</h2>
          <span class="section__count" id="monthListCount"></span>
        </div>
        <div class="mlist" id="monthList"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p class="foot__note">공개 페이지예요. 이름·동호수·연락처·예약번호는 넣지 않고 <b>토실이·아내·단지</b>처럼 부르는 말로만 적었어요.</p>

<script src="app.js?v=20261128c"></script>
<script>
  /* PWA — 서비스 워커 등록. 실패해도 화면 기능은 그대로입니다.
     등록되면 이 화면이 실제로 쓴 css·js·json·이미지를 워커에 넘겨 미리 캐시해,
     처음 설치한 날부터 비행기 모드에서도 열립니다. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        return navigator.serviceWorker.ready.then(function () { return reg; });
      }).then(function (reg) {
        try {
          var base = location.origin + location.pathname.replace(/[^/]*$/, '');
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; })
            .filter(function (u) {
              return u.indexOf(base) === 0 && /\.(css|js|json|png|jpe?g|webp|svg|woff2?)(\?|$)/i.test(u);
            });
          var sw = reg.active || navigator.serviceWorker.controller;
          if (sw && urls.length) sw.postMessage({ type: 'CACHE_URLS', urls: urls });
        } catch (e) {}
      }).catch(function (err) {
        console.warn('서비스 워커 등록 실패', err);
      });
    });
  }
</script>
